services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    image: lunchboxd-api
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/lunchboxd
    depends_on:
      - mongo

  web:
    build: .
    image: lunchboxd-web
    ports:
      - "4173:4173"  # <--- THIS IS CRITICAL. IT MUST BE HERE.
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - api

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: